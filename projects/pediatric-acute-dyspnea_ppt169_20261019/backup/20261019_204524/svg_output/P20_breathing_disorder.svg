<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF9F4"/>

  <g id="header" data-pptx-bounds="60 60 1160 92" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">07 / 呼吸障碍</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">呼吸障碍：把“慢、浅、弱”也纳进来</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1"/>
  </g>

  <g id="disorder-points" data-pptx-bounds="60 168 1160 232" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="192" font-size="16" font-weight="bold" fill="#B3402F">01</text>
    <text x="100" y="192" font-size="20" fill="#1E2A2C">根据呼吸困难的定义，呼吸困难既包括呼吸急促（窘迫），又包括呼吸浅慢、呼吸肌麻痹<tspan x="100" dy="28">所致空气不够用的窒息感。</tspan></text>

    <text x="60" y="264" font-size="16" font-weight="bold" fill="#B3402F">02</text>
    <text x="100" y="264" font-size="20" fill="#1E2A2C">成人和较大儿童能主动描述这种不适感，而婴幼儿不能准确表达，需要医生依赖客观体征判断。</text>

    <text x="60" y="308" font-size="16" font-weight="bold" fill="#B3402F">03</text>
    <text x="100" y="308" font-size="20" fill="#1E2A2C">但临床上的普遍认知是“呼吸困难 = 呼吸急促/窘迫”，对表现为“慢、浅、弱”的呼吸困难容易忽视。</text>

    <text x="60" y="352" font-size="16" font-weight="bold" fill="#B3402F">04</text>
    <text x="100" y="352" font-size="20" fill="#1E2A2C">为此，本文参照心律失常的分类（快速型和缓慢型），提出“呼吸障碍”这一名词，包括快速型<tspan x="100" dy="28">和缓慢型 2 个类型。</tspan></text>
  </g>

  <g id="disorder-fast" data-pptx-bounds="60 418 560 202" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="422" width="560" height="196" fill="#F5F1E8"/>
    <rect x="60" y="422" width="560" height="4" fill="#6E8A8F"/>
    <text x="92" y="484" font-family="Georgia, SimSun, serif" font-size="36" fill="#6E8A8F">01</text>
    <text x="172" y="482" font-size="28" font-weight="bold" fill="#123A46">快速型呼吸障碍</text>
    <text x="92" y="534" font-size="20" fill="#1E2A2C">即表现为呼吸急促或费力的呼吸困难。</text>
    <line x1="92" y1="560" x2="588" y2="560" stroke="#D5CCB9" stroke-width="1"/>
    <text x="92" y="592" font-size="16" fill="#5B6A6B">临床最熟悉的一半。</text>
  </g>

  <g id="disorder-slow" data-pptx-bounds="660 418 560 202" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="660" y="422" width="560" height="196" fill="#F0EBE0"/>
    <rect x="660" y="422" width="560" height="4" fill="#B3402F"/>
    <text x="692" y="484" font-family="Georgia, SimSun, serif" font-size="36" fill="#B3402F">02</text>
    <text x="772" y="482" font-size="28" font-weight="bold" fill="#B3402F">缓慢型呼吸障碍</text>
    <text x="692" y="534" font-size="20" fill="#1E2A2C">以呼吸频率减慢、通气不足为特征。</text>
    <line x1="692" y1="560" x2="1188" y2="560" stroke="#D5CCB9" stroke-width="1"/>
    <text x="692" y="592" font-size="16" fill="#5B6A6B">最容易被忽略的一半。</text>
    <g transform="translate(1172,570) scale(1.0)" fill="none" stroke="#B3402F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 9v4"/>
      <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/>
      <path d="M12 16h.01"/>
    </g>
  </g>

  <g id="footer" data-pptx-bounds="60 660 1160 46" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="676" x2="1220" y2="676" stroke="#D5CCB9" stroke-width="1"/>
    <text x="60" y="700" font-size="16" fill="#5B6A6B">儿童急性呼吸困难 · 诊疗思路</text>
    <text x="1220" y="700" font-size="16" fill="#5B6A6B" text-anchor="end">20 / 21</text>
  </g>
</svg>
