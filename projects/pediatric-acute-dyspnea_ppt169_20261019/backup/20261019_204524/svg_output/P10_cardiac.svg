<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF9F4"/>

  <g id="header" data-pptx-bounds="60 60 1160 92" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">03 / 病因及表现</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">心源性：与肺病“像”，但线索不同</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1"/>
    <g transform="translate(1166,70) scale(1.15)" fill="none" stroke="#B3402F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/>
    </g>
  </g>

  <g id="cardiac-mechanism" data-pptx-bounds="60 168 540 400" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="196" font-size="16" font-weight="bold" letter-spacing="2" fill="#6E8A8F">机制</text>
    <text x="60" y="232" font-size="20" fill="#1E2A2C">各种原因引起的左心功能不全致肺淤血和肺泡弹<tspan x="60" dy="29">性减低，气体弥散功能下降，肺泡张力增高，刺</tspan><tspan x="60" dy="29">激肺牵张感受器，兴奋迷走神经，以及肺循环压</tspan><tspan x="60" dy="29">力升高对呼吸中枢的反射性刺激所致。</tspan></text>

    <text x="60" y="404" font-size="16" font-weight="bold" letter-spacing="2" fill="#6E8A8F">特点</text>
    <text x="60" y="440" font-size="20" fill="#1E2A2C">呼吸急促、费力，两肺湿啰音及哮鸣音，与肺炎、<tspan x="60" dy="29">急性呼吸窘迫综合征所致的混合性呼吸困难难以</tspan><tspan x="60" dy="29">鉴别。</tspan></text>
  </g>

  <g id="cardiac-diff" data-pptx-bounds="660 168 560 400" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="660" y="172" width="360" height="30" fill="#F0EBE0"/>
    <text x="674" y="194" font-size="16" font-weight="bold" fill="#123A46">与肺部疾病鉴别的 7 条线索</text>

    <text x="660" y="244" font-size="16" font-weight="bold" fill="#B3402F">01</text>
    <text x="692" y="245" font-size="20" fill="#1E2A2C">精神面色差，与肺部疾病的严重程度不相符。</text>
    <text x="660" y="286" font-size="16" font-weight="bold" fill="#B3402F">02</text>
    <text x="692" y="287" font-size="20" fill="#1E2A2C">常有烦躁不安、拒奶、汗多等非特异性表现。</text>
    <text x="660" y="328" font-size="16" font-weight="bold" fill="#B3402F">03</text>
    <text x="692" y="329" font-size="20" fill="#1E2A2C">查体有心音低、奔马律、肝大等体征。</text>
    <text x="660" y="370" font-size="16" font-weight="bold" fill="#B3402F">04</text>
    <text x="692" y="371" font-size="20" fill="#1E2A2C">胸片示心影增大。</text>
    <text x="660" y="412" font-size="16" font-weight="bold" fill="#B3402F">05</text>
    <text x="692" y="413" font-size="20" fill="#1E2A2C">床旁超声左室射血分数降低、下腔静脉塌陷 &lt; 50%。</text>
    <text x="660" y="454" font-size="16" font-weight="bold" fill="#B3402F">06</text>
    <text x="692" y="455" font-size="20" fill="#1E2A2C">血脑钠肽增高。</text>
    <text x="660" y="496" font-size="16" font-weight="bold" fill="#B3402F">07</text>
    <text x="692" y="497" font-size="20" fill="#1E2A2C">经强力抗感染、雾化止喘等治疗效果不佳。</text>
  </g>

  <g id="cardiac-conclusion" data-pptx-bounds="660 520 560 90" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="660" y1="532" x2="1220" y2="532" stroke="#B3402F" stroke-width="2"/>
    <text x="660" y="574" font-size="20" font-weight="bold" fill="#B3402F">出现上述情况时应考虑心源性呼吸困难可能。</text>
  </g>

  <g id="footer" data-pptx-bounds="60 672 1160 34" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="676" x2="1220" y2="676" stroke="#D5CCB9" stroke-width="1"/>
    <text x="60" y="700" font-size="16" fill="#5B6A6B">儿童急性呼吸困难 · 诊疗思路</text>
    <text x="1220" y="700" font-size="16" fill="#5B6A6B" text-anchor="end">10 / 21</text>
  </g>
</svg>
