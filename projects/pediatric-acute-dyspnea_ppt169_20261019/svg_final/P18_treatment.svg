    </g>
  </g>

  <g id="treatment-banner" data-pptx-bounds="60 168 1160 66" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="168" width="1160" height="64" fill="#123A46" />
    <text x="92" y="209" font-size="28" font-weight="bold" fill="#FBF9F4">对所有呼吸困难患儿应遵循“先救命、后治病”的原则，进行严重度评估。</text>
  </g>

  <g id="treatment-timeline" data-pptx-bounds="60 256 740 380" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line id="timeline-spine" x1="90" y1="290" x2="90" y2="580" stroke="#D5CCB9" stroke-width="2" />

    <circle cx="90" cy="290" r="18" fill="#FBF9F4" stroke="#123A46" stroke-width="2" />
    <text x="90" y="296" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">01</text>
    <text x="130" y="296" font-size="20" fill="#1E2A2C">开放气道：保持呼吸道通畅。</text>

    <circle cx="90" cy="356" r="18" fill="#FBF9F4" stroke="#123A46" stroke-width="2" />
    <text x="90" y="362" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">02</text>
    <text x="130" y="362" font-size="20" fill="#1E2A2C">监护：进行心电和氧饱和度监护。</text>

    <circle cx="90" cy="422" r="18" fill="#FBF9F4" stroke="#123A46" stroke-width="2" />
    <text x="90" y="428" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">03</text>
    <text x="130" y="428" font-size="20" fill="#1E2A2C">建立静脉通路。</text>

    <circle cx="90" cy="488" r="18" fill="#FBF9F4" stroke="#123A46" stroke-width="2" />
    <text x="90" y="494" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">04</text>
    <text x="130" y="494" font-size="20" font-weight="bold" fill="#123A46">呼吸支持（立即给予）</text>
    <text font-size="20" fill="#1E2A2C" x="130" y="524">根据严重程度选择适当的氧疗方式——鼻导管、面罩、</text><text font-size="20" fill="#1E2A2C" x="130" y="552">经鼻高流量氧疗或无创通气，纠正低氧血症。</text><rect x="72" y="562" width="36" height="36" fill="#B3402F" />
    <text x="90" y="586" font-size="16" font-weight="bold" fill="#FBF9F4" text-anchor="middle">05</text>
    <text x="130" y="578" font-size="20" font-weight="bold" fill="#B3402F">有创机械通气启动指征</text>
    <text x="130" y="608" font-size="20" fill="#1E2A2C">意识改变；严重低氧血症；二氧化碳进行性升高；呼吸肌疲劳。</text>
  </g>

  <g id="ventilation-panel" data-pptx-bounds="840 264 380 300" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="840" y="268" width="380" height="292" fill="#F5F1E8" />
    <rect x="840" y="268" width="380" height="4" fill="#B3402F" />

    <text x="864" y="304" font-size="18" font-weight="bold" fill="#123A46">氧疗方式：按严重程度选择</text>
    <circle cx="870" cy="334" r="3" fill="#B3402F" />
    <text x="886" y="340" font-size="20" fill="#1E2A2C">鼻导管</text>
    <circle cx="870" cy="370" r="3" fill="#B3402F" />
    <text x="886" y="376" font-size="20" fill="#1E2A2C">面罩</text>
    <circle cx="870" cy="406" r="3" fill="#B3402F" />
    <text x="886" y="412" font-size="20" fill="#1E2A2C">经鼻高流量氧疗</text>
    <circle cx="870" cy="442" r="3" fill="#B3402F" />
    <text x="886" y="448" font-size="20" fill="#1E2A2C">无创通气</text>

    <line x1="864" y1="474" x2="1196" y2="474" stroke="#D5CCB9" stroke-width="1" />
    <text font-size="16" fill="#5B6A6B" x="864" y="504">应及时启动有创机械通气，避免持续的低氧</text><text font-size="16" fill="#5B6A6B" x="864" y="526">血症或高碳酸血症，导致昏迷甚至呼吸心</text><text font-size="16" fill="#5B6A6B" x="864" y="548">跳骤停。</text></g>

  <g id="footer" data-pptx-bounds="60 660 1160 46" font-family="Segoe UI, Microsoft YaHei, sans-serif">
