<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF9F4" />

  <g id="header" data-pptx-bounds="60 60 1160 92" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">05 / 病因诊断思路</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">第一步与第二步：先定时相，再分喘息</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1" />
  </g>

  <g id="step1-band" data-pptx-bounds="60 168 1160 216" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="172" width="1160" height="204" fill="#F5F1E8" />
    <rect x="60" y="172" width="6" height="204" fill="#123A46" />
    <text x="92" y="216" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">01</text>
    <text x="92" y="244" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">第 1 步</text>
    <text x="1220" y="196" font-size="16" fill="#5B6A6B" text-anchor="end">图 1 · 第 1 步</text>

    <text x="190" y="214" font-size="24" font-weight="bold" fill="#123A46">区分吸气性或呼气性呼吸困难</text>

    <text x="190" y="256" font-size="20" font-weight="bold" fill="#B3402F">吸气性</text>
    <text x="190" y="286" font-size="20" fill="#1E2A2C">病变在胸外大气道（喉、声门下、气管）</text>
    <text x="190" y="322" font-size="16" font-weight="bold" letter-spacing="2" fill="#6E8A8F">表现</text>
    <text font-size="20" fill="#1E2A2C" x="190" y="350">吸气费力、三凹征、吸气性喉鸣，见于急性喉</text><text font-size="20" fill="#1E2A2C" x="190" y="378">炎、喉软化、气道异物等大气道梗阻性疾病。</text><text x="720" y="256" font-size="20" font-weight="bold" fill="#6E8A8F">呼气性</text>
    <text font-size="20" fill="#1E2A2C" x="720" y="286">病变在胸内小气道，如支气管哮喘、</text><text font-size="20" fill="#1E2A2C" x="720" y="314">毛细支气管炎等。</text><text x="720" y="350" font-size="20" fill="#1E2A2C">→ 进入第二步继续区分。</text>
  </g>

  <g id="step2-band" data-pptx-bounds="60 392 1160 232" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="396" width="1160" height="224" fill="#F0EBE0" />
    <rect x="60" y="396" width="6" height="224" fill="#123A46" />
    <text x="92" y="440" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">02</text>
    <text x="92" y="468" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">第 2 步</text>
    <text x="1220" y="420" font-size="16" fill="#5B6A6B" text-anchor="end">图 1 · 第 2 步</text>

    <text x="190" y="438" font-size="24" font-weight="bold" fill="#123A46">区分喘息性疾病与呼吸急促</text>
    <text x="190" y="470" font-size="20" fill="#1E2A2C">喘息与呼吸急促有时难以准确区分。</text>

    <text x="190" y="510" font-size="20" font-weight="bold" fill="#B3402F">有典型哮鸣音</text>
    <text font-size="20" fill="#1E2A2C" x="190" y="540">提示存在支气管痉挛或狭窄，患儿多为毛细</text><text font-size="20" fill="#1E2A2C" x="190" y="568">支气管炎、喘息性支气管炎、支气管哮喘等。</text><text x="720" y="510" font-size="20" font-weight="bold" fill="#6E8A8F">无哮鸣音、仅为呼吸急促</text>
    <text font-size="20" fill="#1E2A2C" x="720" y="540">可能为肺间质性或血管性疾病，并警惕肺外</text><text font-size="20" fill="#1E2A2C" x="720" y="568">及全身性疾病（如中毒性、血源性或精神性</text><text font-size="20" fill="#1E2A2C" x="720" y="596">呼吸困难）。</text><text x="190" y="600" font-size="20" fill="#1E2A2C">判断依据：根据病史与临床表现，以及血气等辅助检查结果可明确。</text>
  </g>

  <g id="footer" data-pptx-bounds="60 660 1160 46" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="676" x2="1220" y2="676" stroke="#D5CCB9" stroke-width="1" />
    <text x="60" y="700" font-size="16" fill="#5B6A6B">儿童急性呼吸困难 · 诊疗思路</text>
    <text x="1220" y="700" font-size="16" fill="#5B6A6B" text-anchor="end">16 / 21</text>
  </g>
</svg>