  <g id="pulmonary-table" data-pptx-bounds="60 155 1160 496" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="176" font-size="20" fill="#1E2A2C">可表现为吸气性、呼气性和混合性呼吸困难。</text>

    <rect x="60" y="204" width="1160" height="46" fill="#6E8A8F" />
    <text x="80" y="235" font-size="18" font-weight="bold" fill="#FBF9F4">类型</text>
    <text x="274" y="235" font-size="18" font-weight="bold" fill="#FBF9F4">常见病因</text>
    <text x="744" y="235" font-size="18" font-weight="bold" fill="#FBF9F4">临床表现</text>

    <rect x="60" y="250" width="4" height="118" fill="#123A46" />
    <text x="80" y="294" font-size="20" font-weight="bold" fill="#123A46">吸气性</text>
    <text font-size="20" fill="#1E2A2C" x="274" y="286">喉、气管、大支气管病变：急性喉炎、</text><text font-size="20" fill="#1E2A2C" x="274" y="316">喉软化、气道异物、外部病变压迫等引起</text><text font-size="20" fill="#1E2A2C" x="274" y="346">的中心气道狭窄与阻塞</text><text font-size="20" fill="#1E2A2C" x="744" y="286">吸气费力，三凹征，张口呼吸，可伴</text><text font-size="20" fill="#1E2A2C" x="744" y="316">剧烈干咳及高调吸气性喉鸣。</text><line x1="60" y1="368" x2="1220" y2="368" stroke="#D5CCB9" stroke-width="1" />

    <rect x="60" y="368" width="4" height="112" fill="#6E8A8F" />
    <text x="80" y="410" font-size="20" font-weight="bold" fill="#123A46">呼气性</text>
    <text font-size="20" fill="#1E2A2C" x="274" y="402">哮喘急性发作、毛细支气管炎、喘息性</text><text font-size="20" fill="#1E2A2C" x="274" y="432">支气管炎等</text><text x="744" y="402" font-size="20" fill="#1E2A2C">呼气延长及费力，常伴有呼气相哮鸣音。</text>
    <line x1="60" y1="480" x2="1220" y2="480" stroke="#D5CCB9" stroke-width="1" />

    <rect x="60" y="480" width="4" height="124" fill="#B3402F" />
    <text x="80" y="524" font-size="20" font-weight="bold" fill="#123A46">混合性</text>
    <text font-size="20" fill="#1E2A2C" x="274" y="516">重症肺炎、肺水肿、气胸、大量胸腔积</text><text font-size="20" fill="#1E2A2C" x="274" y="546">液、弥漫性肺间质疾病等</text><text font-size="20" fill="#1E2A2C" x="744" y="516">吸气及呼气时均感费力，呼吸增快，肺</text><text font-size="20" fill="#1E2A2C" x="744" y="546">部闻及干湿啰音，呼吸音增强或减弱。</text><line x1="60" y1="604" x2="1220" y2="604" stroke="#123A46" stroke-width="2" />

    <text x="60" y="640" font-size="16" fill="#5B6A6B">按时相定位，是四步法的第一步。</text>
  </g>

