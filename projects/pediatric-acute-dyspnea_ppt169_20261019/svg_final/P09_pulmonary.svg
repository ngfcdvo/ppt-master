    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">03 / 病因及表现</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">肺源性：看时相，锁定病变部位</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1" />
    <g transform="translate(1166,70) scale(1.15)" fill="none" stroke="#6E8A8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
