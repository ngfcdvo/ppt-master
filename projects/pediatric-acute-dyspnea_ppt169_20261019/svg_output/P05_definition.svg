<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF9F4"/>

  <g id="header" data-pptx-bounds="60 60 1160 92" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">01 / 定义</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">定义：主观体验 + 客观体征</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1"/>
  </g>

  <g id="definition-top" data-pptx-bounds="60 170 1160 190" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="196" font-size="16" font-weight="bold" letter-spacing="2" fill="#6E8A8F">主观体验 / SYMPTOM</text>
    <text x="60" y="240" font-size="20" fill="#1E2A2C">呼吸困难指患者自觉空气不足、呼吸费力或窒息等<tspan x="60" dy="34">呼吸不适的主观体验。</tspan></text>

    <line x1="620" y1="176" x2="620" y2="330" stroke="#D5CCB9" stroke-width="1"/>

    <text x="660" y="196" font-size="16" font-weight="bold" letter-spacing="2" fill="#6E8A8F">客观表现 / SIGN</text>
    <text x="660" y="240" font-size="20" fill="#1E2A2C">伴或不伴呼吸费力的客观表现：<tspan x="660" dy="34">张口呼吸、点头呼吸、呻吟、鼻翼扇动、三凹征等。</tspan></text>
  </g>

  <g id="definition-quote" data-pptx-bounds="60 340 1160 130" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="352" width="4" height="44" fill="#B3402F"/>
    <text x="88" y="386" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#123A46">呼吸困难既是症状，也是体征。</text>
    <text x="88" y="438" font-size="20" fill="#1E2A2C">并可有呼吸频率、深度与节律的改变。</text>
  </g>

  <g id="definition-note" data-pptx-bounds="60 480 1160 140" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="484" width="1160" height="118" fill="#F5F1E8"/>
    <rect x="60" y="484" width="6" height="118" fill="#B3402F"/>
    <g transform="translate(88,510) scale(1.05)" fill="none" stroke="#B3402F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 9v4"/>
      <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/>
      <path d="M12 16h.01"/>
    </g>
    <text x="130" y="522" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">婴幼儿的判断依据</text>
    <text x="130" y="562" font-size="20" fill="#1E2A2C">婴幼儿因年龄、语言及社会心理等因素的影响，不能准确描述呼吸困难，主要根据客观体征来判断。</text>
  </g>

  <g id="footer" data-pptx-bounds="60 672 1160 34" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="676" x2="1220" y2="676" stroke="#D5CCB9" stroke-width="1"/>
    <text x="60" y="700" font-size="16" fill="#5B6A6B">儿童急性呼吸困难 · 诊疗思路</text>
    <text x="1220" y="700" font-size="16" fill="#5B6A6B" text-anchor="end">05 / 21</text>
  </g>
</svg>
