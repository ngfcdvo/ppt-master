<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF9F4"/>

  <g id="header" data-pptx-bounds="60 60 1160 92" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">02 / 机制</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">正常呼吸：一条经典的神经反射弧</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1"/>
    <g transform="translate(1168,72) scale(1.05)" fill="none" stroke="#6E8A8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 8h8.5a2.5 2.5 0 1 0 -2.34 -3.24"/>
      <path d="M3 12h15.5a2.5 2.5 0 1 1 -2.34 3.24"/>
      <path d="M4 16h5.5a2.5 2.5 0 1 1 -2.34 3.24"/>
    </g>
  </g>

  <g id="reflex-chain" data-pptx-bounds="60 180 1160 450" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="110" y1="216" x2="110" y2="596" stroke="#D5CCB9" stroke-width="2"/>

    <circle cx="110" cy="208" r="24" fill="#FBF9F4" stroke="#123A46" stroke-width="2"/>
    <text x="110" y="214" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">01</text>
    <text x="160" y="216" font-size="20" font-weight="bold" fill="#123A46">感受器</text>
    <text x="250" y="216" font-size="20" fill="#1E2A2C">中枢/外周化学感受器或机械感受器，感知机体内环境和肺部机械张力的变化。</text>

    <circle cx="110" cy="304" r="24" fill="#FBF9F4" stroke="#123A46" stroke-width="2"/>
    <text x="110" y="310" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">02</text>
    <text x="160" y="312" font-size="20" font-weight="bold" fill="#123A46">传入</text>
    <text x="250" y="312" font-size="20" fill="#1E2A2C">信号经迷走神经、舌咽神经传入脑干呼吸中枢。</text>

    <circle cx="110" cy="400" r="24" fill="#FBF9F4" stroke="#123A46" stroke-width="2"/>
    <text x="110" y="406" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">03</text>
    <text x="160" y="408" font-size="20" font-weight="bold" fill="#123A46">中枢</text>
    <text x="250" y="408" font-size="20" fill="#1E2A2C">脑干呼吸中枢整合信号。</text>

    <circle cx="110" cy="496" r="24" fill="#FBF9F4" stroke="#123A46" stroke-width="2"/>
    <text x="110" y="502" font-size="16" font-weight="bold" fill="#123A46" text-anchor="middle">04</text>
    <text x="160" y="504" font-size="20" font-weight="bold" fill="#123A46">传出</text>
    <text x="250" y="504" font-size="20" fill="#1E2A2C">经膈神经和肋间神经将指令传至膈肌和肋间外肌。</text>

    <circle cx="110" cy="588" r="24" fill="#123A46" stroke="#123A46" stroke-width="2"/>
    <text x="110" y="594" font-size="16" font-weight="bold" fill="#FBF9F4" text-anchor="middle">05</text>
    <text x="160" y="596" font-size="20" font-weight="bold" fill="#123A46">效应</text>
    <text x="250" y="596" font-size="20" fill="#1E2A2C">产生呼吸动力，驱动空气经气道进入肺泡，完成通气过程。</text>
  </g>

  <g id="footer" data-pptx-bounds="60 672 1160 34" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="676" x2="1220" y2="676" stroke="#D5CCB9" stroke-width="1"/>
    <text x="60" y="700" font-size="16" fill="#5B6A6B">儿童急性呼吸困难 · 诊疗思路</text>
    <text x="1220" y="700" font-size="16" fill="#5B6A6B" text-anchor="end">07 / 21</text>
  </g>
</svg>
