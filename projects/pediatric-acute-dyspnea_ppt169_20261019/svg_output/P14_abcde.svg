<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF9F4"/>

  <g id="header" data-pptx-bounds="60 60 1160 92" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">04 / 分度与评估</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">评估：ABCDE 五步快速识别危重</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1"/>
    <g transform="translate(1180,70) scale(1.1)" fill="none" stroke="#B3402F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 4h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2v-2a2 2 0 0 1 2 -2"/>
      <path d="M4 13h4a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-4a2 2 0 0 1 -2 -2v-2a2 2 0 0 1 2 -2"/>
      <path d="M14 4h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2"/>
      <path d="M14 13h4a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-4"/>
      <path d="M8 12h4"/>
    </g>
  </g>

  <g id="abcde-lead" data-pptx-bounds="60 158 1160 34" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="180" font-size="20" fill="#1E2A2C">主要根据病史、临床表现与体征、发展速度，快速识别是否存在危及生命的情况，以指导紧急处理的优先级。</text>
  </g>

  <g id="abcde-steps" data-pptx-bounds="60 200 1160 380" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="206" width="64" height="64" fill="#123A46"/>
    <text x="92" y="250" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#FBF9F4" text-anchor="middle">A</text>
    <text x="150" y="246" font-size="18" font-weight="bold" fill="#123A46">气道</text>
    <text x="230" y="246" font-size="20" fill="#1E2A2C">评估气道是否通畅，有无异物、喉鸣、喘鸣。</text>
    <line x1="60" y1="280" x2="1220" y2="280" stroke="#D5CCB9" stroke-width="1"/>

    <rect x="60" y="280" width="64" height="64" fill="#123A46"/>
    <text x="92" y="324" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#FBF9F4" text-anchor="middle">B</text>
    <text x="150" y="320" font-size="18" font-weight="bold" fill="#123A46">呼吸</text>
    <text x="230" y="320" font-size="20" fill="#1E2A2C">评估呼吸频率、呼吸做功、有无异常呼吸音及异常体位。</text>
    <line x1="60" y1="354" x2="1220" y2="354" stroke="#D5CCB9" stroke-width="1"/>

    <rect x="60" y="354" width="64" height="64" fill="#123A46"/>
    <text x="92" y="398" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#FBF9F4" text-anchor="middle">C</text>
    <text x="150" y="394" font-size="18" font-weight="bold" fill="#123A46">循环</text>
    <text x="230" y="394" font-size="20" fill="#1E2A2C">评估心率、血压、肤色、有无发绀或花纹等循环状态。</text>
    <line x1="60" y1="428" x2="1220" y2="428" stroke="#D5CCB9" stroke-width="1"/>

    <rect x="60" y="428" width="64" height="64" fill="#123A46"/>
    <text x="92" y="472" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#FBF9F4" text-anchor="middle">D</text>
    <text x="150" y="468" font-size="18" font-weight="bold" fill="#123A46">神经功能</text>
    <text x="230" y="468" font-size="20" fill="#1E2A2C">评估意识及反应状态，有无烦躁、嗜睡或昏迷。</text>
    <line x1="60" y1="502" x2="1220" y2="502" stroke="#D5CCB9" stroke-width="1"/>

    <rect x="60" y="502" width="64" height="64" fill="#123A46"/>
    <text x="92" y="546" font-family="Georgia, SimSun, serif" font-size="28" font-weight="bold" fill="#FBF9F4" text-anchor="middle">E</text>
    <text x="150" y="542" font-size="18" font-weight="bold" fill="#123A46">暴露</text>
    <text x="230" y="542" font-size="20" fill="#1E2A2C">询问病史，全面查体，观察面色，有无皮疹、水肿、外伤等。</text>
  </g>

  <g id="abcde-positioning" data-pptx-bounds="60 588 1160 68" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="592" x2="1220" y2="592" stroke="#B3402F" stroke-width="2"/>
    <text x="60" y="620" font-size="20" fill="#1E2A2C">初步评估后，应辨别患儿是否为上气道或下气道梗阻、肺实质/胸膜疾病、心源性呼吸困难，或其他原因；</text>
    <text x="60" y="647" font-size="20" fill="#1E2A2C">这一“定位”思路有助于快速明确病因，给予相应的紧急处理。</text>
  </g>

  <g id="footer" data-pptx-bounds="60 672 1160 34" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="676" x2="1220" y2="676" stroke="#D5CCB9" stroke-width="1"/>
    <text x="60" y="700" font-size="16" fill="#5B6A6B">儿童急性呼吸困难 · 诊疗思路</text>
    <text x="1220" y="700" font-size="16" fill="#5B6A6B" text-anchor="end">14 / 21</text>
  </g>
</svg>
