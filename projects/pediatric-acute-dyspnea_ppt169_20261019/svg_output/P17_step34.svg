<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF9F4"/>

  <g id="header" data-pptx-bounds="60 60 1160 92" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="60" y="84" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">05 / 病因诊断思路</text>
    <text x="60" y="126" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">第三步与第四步：混合性与缓慢型</text>
    <line x1="60" y1="142" x2="1220" y2="142" stroke="#D5CCB9" stroke-width="1"/>
  </g>

  <g id="step3-band" data-pptx-bounds="60 168 1160 256" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="172" width="1160" height="248" fill="#F5F1E8"/>
    <rect x="60" y="172" width="6" height="248" fill="#123A46"/>
    <text x="92" y="216" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#123A46">03</text>
    <text x="92" y="244" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">第 3 步</text>

    <text x="190" y="210" font-size="24" font-weight="bold" fill="#123A46">识别混合性呼吸困难</text>
    <text x="190" y="244" font-size="20" fill="#1E2A2C">当患儿既无典型的吸气性三凹征，也无典型<tspan x="190" dy="28">的哮鸣音，而是呈现全程呼吸急促、费力</tspan><tspan x="190" dy="28">时，为混合性呼吸困难。</tspan></text>
    <text x="190" y="332" font-size="20" fill="#1E2A2C">常见于重症肺炎肺实变、大量胸腔积液、心<tspan x="190" dy="28">功能不全、急性呼吸窘迫综合征等肺源性疾</tspan><tspan x="190" dy="28">病，以及各种原因引起的心功能不全。</tspan></text>
    <text x="190" y="414" font-size="16" fill="#5B6A6B">二者的鉴别要点如前所述（见 3.2 心源性呼吸困难）。</text>

    <text x="1220" y="194" font-size="16" fill="#5B6A6B" text-anchor="end">图 1 · 第 3 步</text>
    <text x="700" y="212" font-size="20" fill="#1E2A2C">吸气、呼气均费力，呼吸音增强或减低，<tspan x="700" dy="28">肺部可闻及干湿啰音。</tspan></text>

    <text x="700" y="272" font-size="18" font-weight="bold" fill="#6E8A8F">肺源性</text>
    <text x="700" y="300" font-size="20" fill="#1E2A2C">肺炎、肺实变、大量胸腔积液、急性呼吸<tspan x="700" dy="28">窘迫综合征。</tspan></text>

    <text x="700" y="360" font-size="18" font-weight="bold" fill="#B3402F">心源性</text>
    <text x="700" y="388" font-size="20" fill="#1E2A2C">心音低、奔马律、肝大、脑钠肽升高、左室<tspan x="700" dy="28">射血分数降低。</tspan></text>
  </g>

  <g id="step4-band" data-pptx-bounds="60 432 1160 216" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="60" y="436" width="1160" height="208" fill="#F0EBE0"/>
    <rect x="60" y="436" width="6" height="208" fill="#B3402F"/>
    <text x="92" y="480" font-family="Georgia, SimSun, serif" font-size="36" font-weight="bold" fill="#B3402F">04</text>
    <text x="92" y="508" font-size="16" font-weight="bold" letter-spacing="2" fill="#B3402F">第 4 步</text>

    <text x="190" y="474" font-size="24" font-weight="bold" fill="#B3402F">注意缓慢型呼吸困难</text>
    <text x="190" y="506" font-size="20" fill="#1E2A2C">这类呼吸困难容易被忽略，需特别警惕。</text>
    <text x="190" y="538" font-size="20" fill="#1E2A2C">呼吸浅慢、呼吸节律不规整、伴呼吸幅度降<tspan x="190" dy="28">低，而非呼吸频率增快——提示神经系统或</tspan><tspan x="190" dy="28">呼吸肌受累。</tspan></text>

    <text x="1220" y="462" font-size="16" fill="#5B6A6B" text-anchor="end">图 1 · 第 4 步</text>
    <g transform="translate(1156,444) scale(0.95)" fill="none" stroke="#B3402F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 9v4"/>
      <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/>
      <path d="M12 16h.01"/>
    </g>

    <text x="700" y="506" font-size="18" font-weight="bold" fill="#B3402F">常见病因</text>
    <text x="700" y="534" font-size="20" fill="#1E2A2C">颅内感染、出血所致颅高压，使用镇痛镇<tspan x="700" dy="28">静药物，吉兰-巴雷综合征、重症肌无力等。</tspan></text>
    <text x="700" y="600" font-size="20" fill="#1E2A2C">结合病史、神经系统体征、头颅影像学检<tspan x="700" dy="28">查可进一步鉴别。</tspan></text>
  </g>

  <g id="footer" data-pptx-bounds="60 660 1160 46" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <line x1="60" y1="676" x2="1220" y2="676" stroke="#D5CCB9" stroke-width="1"/>
    <text x="60" y="700" font-size="16" fill="#5B6A6B">儿童急性呼吸困难 · 诊疗思路</text>
    <text x="1220" y="700" font-size="16" fill="#5B6A6B" text-anchor="end">17 / 21</text>
  </g>
</svg>
